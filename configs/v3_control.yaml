project:
  name: medft-v3-control
  seed: 42
model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: main
  local_path: null
  cache_dir: .cache/huggingface
  manifest: models/base_manifest.json
  trust_remote_code: false
system_prompt: 你是一名健康信息与就医咨询助手。请使用清楚、谨慎的中文回答。 信息不足时先追问关键症状；可以解释医学常识、常见检查和就诊方向。 不作确诊，不替用户决定处方、剂量或治疗方案。
  遇到急危重症或自伤风险，应优先给出及时求助的指引。 普通知识问题应提供有帮助的解释，避免一概拒答。
data_generation:
  seed_source: assets/v2_1_seeds.jsonl
  template_profile: v3
  synthetic_counts:
    knowledge_qa: 0
    symptom_collection: 0
    triage: 0
    examination: 0
    report_interpretation: 0
    refusal: 0
  public:
    count: 1000
    scan_limit: 400000
    cache_dir: .cache/datasets
    manifest: data/raw/huatuo_encyclopedia/manifest.json
    exclusions: assets/huatuo_quality_exclusions.json
    rewrites: assets/v3_public_rewrites.json
data:
  source: data/generated/v3-control/corpus.jsonl
  evaluation_source: assets/evaluation_v2.jsonl
  evaluation_exclusions:
  - assets/evaluation_v1.jsonl
  output_dir: data/processed/v3-control
  validation_ratio: 0.2
  test_ratio: 0
  target_mix:
    knowledge_qa: 0.4
    symptom_collection: 0.2
    triage: 0.15
    examination: 0.1
    report_interpretation: 0.1
    refusal: 0.05
  # 与V3新数据实验使用字节相同的验证集，由curate-data一次性准备。
  fixed_validation_source: data/processed/v3/validation.jsonl
training:
  output_dir: outputs/v3-control
  max_length: 1024
  epochs: 1
  learning_rate: 5.0e-05
  batch_size: 1
  gradient_accumulation_steps: 8
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  compute_dtype: float16
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 10
  early_stopping_patience: 3
  early_stopping_threshold: 0.0
  require_all_samples: true
generation:
  max_new_tokens: 256
  max_input_tokens: 2048
  do_sample: false
evaluation:
  output_dir: outputs/evaluations
